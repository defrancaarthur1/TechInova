<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastros - Sistema de Controle de Compras</title>

    <link rel="stylesheet" href="adegastyle.css">
</head>

<body>

    <header class="topbar">

        <h1>Sistema de Controle de Compras</h1>

        <nav>
            <a href="index.html">
                Registrar Compra
            </a>

            <a href="cadastros.html">
                Cadastros
            </a>

            <a href="historico.html">
                Histórico
            </a>
        </nav>

    </header>


    <main class="container">

        <!-- ============================= -->
        <!-- CADASTRO DE PRODUTO -->
        <!-- ============================= -->

        <section class="card">

            <h2>Cadastro de Produto</h2>


            <!-- PRODUTOS JÁ CADASTRADOS -->

            <label for="produtoSelecionado">
                Produto cadastrado
            </label>

            <select id="produtoSelecionado">

                <option value="">
                    Selecione um produto
                </option>

            </select>


            <!-- NOME -->

            <label for="nomeProduto">
                Nome do produto
            </label>

            <input
                type="text"
                id="nomeProduto"
                placeholder="Ex: Coca-Cola 2L"
            >


            <!-- CATEGORIA -->

            <label for="categoria">
                Categoria
            </label>

            <select id="categoria">

                <option value="Selecione">
                    Selecione
                </option>

                <option value="Refrigerante">
                    Refrigerante
                </option>

                <option value="Suco">
                    Suco
                </option>

                <option value="Destilado">
                    Destilado
                </option>

                <option value="Gelo">
                    Gelo
                </option>

            </select>


            <!-- UNIDADE -->

            <label for="unidade">
                Unidade de medida
            </label>

            <select id="unidade">

                <option value="Selecione">
                    Selecione
                </option>

                <option value="Unidade">
                    Unidade
                </option>

                <option value="Caixa">
                    Caixa
                </option>

                <option value="Fardo">
                    Fardo
                </option>

                <option value="Quilograma">
                    Quilograma
                </option>

                <option value="Litro">
                    Litro
                </option>

            </select>


            <!-- BOTÕES -->

            <div class="acoes">

                <button
                    class="btn"
                    id="btnCadastrarProduto"
                    type="button"
                >
                    Cadastrar produto
                </button>

                <button
                    class="btn edit"
                    id="btnEditarProduto"
                    type="button"
                >
                    Editar produto
                </button>

                <button
                    class="btn delete"
                    id="btnExcluirProduto"
                    type="button"
                >
                    Excluir produto
                </button>

            </div>

        </section>


        <!-- ============================= -->
        <!-- CADASTRO DE FORNECEDOR -->
        <!-- ============================= -->

        <section class="card">

            <h2>Cadastro de Fornecedor</h2>


            <label for="empresa">
                Nome da empresa
            </label>

            <input
                type="text"
                id="empresa"
                placeholder="Ex: Coca-Cola"
            >


            <label for="cnpj">
                CNPJ
            </label>

            <input
                type="text"
                id="cnpj"
                placeholder="00.000.000/0000-00"
            >


            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder="(11) 00000-0000"
            >


            <label for="consultor">
                Consultor de vendas
            </label>

            <input
                type="text"
                id="consultor"
                placeholder="Nome do consultor"
            >


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="contato@empresa.com"
            >


            <label for="dataCadastro">
                Data de cadastro
            </label>

            <input
                type="date"
                id="dataCadastro"
            >


            <div class="acoes">

                <button
                    class="btn"
                    id="btnCadastrarFornecedor"
                    type="button"
                >
                    Cadastrar fornecedor
                </button>

                <button
                    class="btn edit"
                    type="button"
                >
                    Editar fornecedor
                </button>

                <button
                    class="btn delete"
                    type="button"
                >
                    Excluir fornecedor
                </button>

            </div>

        </section>

    </main>


    <script src="cadastro.js"></script>

</body>

</html>
