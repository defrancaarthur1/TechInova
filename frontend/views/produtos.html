<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Produto</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

    <header class="cabecalho">

        <h1>
            Sistema de Controle de Compras
        </h1>

        <nav class="menu-navegacao">

            <a href="/views/index.html">
                Início
            </a>

            <a href="/views/compras.html">
                Registrar Compra
            </a>

            <a
                href="/views/produtos.html"
                class="menu-ativo"
            >
                Produtos
            </a>

            <a href="/views/fornecedores.html">
                Fornecedores
            </a>

            <a href="/views/index.html#historico">
                Histórico
            </a>

            <a href="/views/relatorios.html">
                Relatórios
            </a>

            <a
                href="/views/login.html"
                class="botao-sair"
            >
                Sair
            </a>

        </nav>

    </header>


    <main class="pagina-formulario">

        <section class="formulario-grande">

            <h2>
                Cadastro de Produto
            </h2>


            <form id="formProduto">

                <div class="campo-formulario">

                    <label for="nomeProduto">
                        Nome do Produto
                    </label>

                    <input
                        type="text"
                        id="nomeProduto"
                        name="nomeProduto"
                        placeholder="Ex: Coca-Cola 2L"
                        required
                    >

                </div>


                <div class="campo-formulario">

                    <label for="categoria">
                        Categoria
                    </label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="refrigerante">
                            Refrigerante
                        </option>

                        <option value="cerveja">
                            Cerveja
                        </option>

                        <option value="vinho">
                            Vinho
                        </option>

                        <option value="destilado">
                            Destilado
                        </option>

                        <option value="agua">
                            Água
                        </option>

                        <option value="suco">
                            Suco
                        </option>

                    </select>

                </div>


                <div class="campo-formulario">

                    <label for="unidadeMedida">
                        Unidade de Medida
                    </label>

                    <select
                        id="unidadeMedida"
                        name="unidadeMedida"
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="caixa">
                            Caixa
                        </option>

                        <option value="unidade">
                            Unidade
                        </option>

                        <option value="fardo">
                            Fardo
                        </option>

                        <option value="garrafa">
                            Garrafa
                        </option>

                        <option value="litro">
                            Litro
                        </option>

                    </select>

                </div>


                <div class="campo-formulario">

                    <label for="quantidade">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="0"
                        placeholder="Ex: 30"
                        required
                    >

                </div>


                <div class="campo-formulario">

                    <label for="valorUnitario">
                        Valor Unitário
                    </label>

                    <input
                        type="number"
                        id="valorUnitario"
                        name="valorUnitario"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 5,00"
                        required
                    >

                </div>


                <div class="botoes-formulario">

                    <button
                        type="submit"
                        class="btn btn-preto"
                    >
                        Cadastrar Produto
                    </button>

                    <button
                        type="button"
                        class="btn btn-editar"
                    >
                        Editar Cadastro
                    </button>

                    <button
                        type="button"
                        class="btn btn-excluir"
                    >
                        Excluir Cadastro
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../js/produtos.js"></script>

</body>

</html>
