<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Controle de Compras</title>

    <link rel="stylesheet" href="adegastyle.css">
</head>

<body>

    <header class="topbar">

        <h1>Sistema de Controle de Compras</h1>

        <nav id="menuPrincipal">
            <a href="index.html">Registrar Compra</a>
            <a href="cadastros.html">Cadastros</a>
            <a href="editar-excluir.html">Editar / Excluir</a>
            <a href="historico.html">Histórico</a>
            <a href="#" id="btnLogout">Sair</a>
        </nav>

    </header>


    <main class="container">

        <section class="card principal">

            <h2 id="tituloCompra">
                Registrar Compra
            </h2>


            <!-- FORNECEDOR -->

            <label for="fornecedor">
                Fornecedor
            </label>

            <select id="fornecedor">

                <option value="">
                    Selecione o fornecedor
                </option>

            </select>


            <!-- PRODUTO -->

            <label for="produto">
                Produto
            </label>

            <select id="produto">

                <option value="">
                    Selecione o produto
                </option>

            </select>


            <!-- QUANTIDADE -->

            <label for="quantidade">
                Quantidade
            </label>

            <input
                type="number"
                id="quantidade"
                min="1"
                placeholder="Ex: 30"
            >


            <!-- VALOR UNITÁRIO -->

            <label for="valor">
                Valor unitário
            </label>

            <input
                type="number"
                id="valor"
                min="0.01"
                step="0.01"
                placeholder="Ex: 5,00"
            >


            <!-- DATA -->

            <label for="data">
                Data da compra
            </label>

            <input
                type="date"
                id="data"
            >


            <!-- ADICIONAR PRODUTO -->

            <button
                class="btn"
                id="btnAdicionarProduto"
                type="button"
            >
                Adicionar produto
            </button>


            <h3>Itens da compra</h3>


            <!-- TABELA -->

            <table>

                <thead>

                    <tr>

                        <th>Produto</th>

                        <th>Quantidade</th>

                        <th>Valor unitário</th>

                        <th>Subtotal</th>

                        <th>Ações</th>

                    </tr>

                </thead>


                <tbody id="listaItens">

                    <tr>

                        <td colspan="5">
                            Nenhum produto adicionado.
                        </td>

                    </tr>

                </tbody>

            </table>


            <!-- BOTÕES -->

            <div class="acoes">

                <button
                    class="btn success"
                    id="btnRegistrarCompra"
                    type="button"
                >
                    Registrar compra
                </button>


                <button
                    class="btn edit"
                    id="btnEditarCompra"
                    type="button"
                >
                    Editar compra
                </button>


                <button
                    class="btn delete"
                    id="btnExcluirCompra"
                    type="button"
                >
                    Excluir compra
                </button>

            </div>

        </section>

    </main>


    <script>

        // ==================================================
        // ELEMENTOS
        // ==================================================

        const selectFornecedor =
            document.querySelector('#fornecedor');

        const selectProduto =
            document.querySelector('#produto');

        const quantidade =
            document.querySelector('#quantidade');

        const valor =
            document.querySelector('#valor');

        const dataCompra =
            document.querySelector('#data');

        const listaItens =
            document.querySelector('#listaItens');

        const tituloCompra =
            document.querySelector('#tituloCompra');

        const btnAdicionarProduto =
            document.querySelector('#btnAdicionarProduto');

        const btnRegistrarCompra =
            document.querySelector('#btnRegistrarCompra');

        const btnEditarCompra =
            document.querySelector('#btnEditarCompra');

        const btnExcluirCompra =
            document.querySelector('#btnExcluirCompra');


        // ==================================================
        // ARRAY DE ITENS
        // ==================================================

        let itensCompra = [];


        // ==================================================
        // VERIFICAR SE ESTAMOS EDITANDO
        // ==================================================

        const parametrosURL =
            new URLSearchParams(
                window.location.search
            );


        const compraIdEdicao =
            parametrosURL.get('editar');


        const modoEdicao =
            compraIdEdicao !== null;


        // ==================================================
        // FORMATAR DINHEIRO
        // ==================================================

        function formatarMoeda(valor) {

            return Number(valor).toLocaleString(
                'pt-BR',
                {
                    style: 'currency',
                    currency: 'BRL'
                }
            );

        }


        // ==================================================
        // CARREGAR FORNECEDORES
        // ==================================================

        async function carregarFornecedores() {

            try {

                const resposta =
                    await fetch('/api/fornecedores');


                const dados =
                    await resposta.json();


                selectFornecedor.innerHTML =
                    '<option value="">Selecione o fornecedor</option>';


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    console.error(
                        'Erro ao carregar fornecedores:',
                        dados
                    );

                    return;

                }


                dados.fornecedores.forEach(
                    fornecedor => {

                        const option =
                            document.createElement(
                                'option'
                            );


                        option.value =
                            fornecedor.id;


                        option.textContent =
                            fornecedor.empresa;


                        selectFornecedor.appendChild(
                            option
                        );

                    }
                );


            } catch (erro) {

                console.error(
                    'Erro ao carregar fornecedores:',
                    erro
                );

            }

        }


        // ==================================================
        // CARREGAR PRODUTOS
        // ==================================================

        async function carregarProdutos() {

            try {

                const resposta =
                    await fetch('/api/produtos');


                const dados =
                    await resposta.json();


                selectProduto.innerHTML =
                    '<option value="">Selecione o produto</option>';


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    console.error(
                        'Erro ao carregar produtos:',
                        dados
                    );

                    return;

                }


                dados.produtos.forEach(
                    produto => {

                        const option =
                            document.createElement(
                                'option'
                            );


                        option.value =
                            produto.id;


                        option.textContent =
                            produto.nome;


                        selectProduto.appendChild(
                            option
                        );

                    }
                );


            } catch (erro) {

                console.error(
                    'Erro ao carregar produtos:',
                    erro
                );

            }

        }


        // ==================================================
        // ADICIONAR PRODUTO
        // ==================================================

        function adicionarProduto() {

            const produtoId =
                Number(
                    selectProduto.value
                );


            if (!produtoId) {

                alert(
                    'Selecione um produto.'
                );

                return;

            }


            const produtoNome =
                selectProduto.options[
                    selectProduto.selectedIndex
                ].textContent;


            const quantidadeValor =
                Number(
                    quantidade.value
                );


            const valorUnitario =
                Number(
                    valor.value
                );


            if (
                !Number.isFinite(
                    quantidadeValor
                ) ||
                quantidadeValor <= 0
            ) {

                alert(
                    'Informe uma quantidade válida.'
                );

                return;

            }


            if (
                !Number.isFinite(
                    valorUnitario
                ) ||
                valorUnitario <= 0
            ) {

                alert(
                    'Informe um valor unitário válido.'
                );

                return;

            }


            // Evita adicionar o mesmo produto
            // duas vezes na mesma compra.

            const produtoJaExiste =
                itensCompra.some(
                    item =>
                        Number(item.produtoId) ===
                        produtoId
                );


            if (produtoJaExiste) {

                alert(
                    'Este produto já está na compra. Altere a quantidade ou o valor diretamente na tabela.'
                );

                return;

            }


            itensCompra.push({

                produtoId:
                    produtoId,

                produto:
                    produtoNome,

                quantidade:
                    quantidadeValor,

                valorUnitario:
                    valorUnitario,

                subtotal:
                    quantidadeValor *
                    valorUnitario

            });


            atualizarTabelaItens();


            selectProduto.value = '';

            quantidade.value = '';

            valor.value = '';

        }


        // ==================================================
        // ALTERAR QUANTIDADE
        // ==================================================

        function alterarQuantidade(
            indice,
            novoValor
        ) {

            const quantidadeNova =
                Number(
                    novoValor
                );


            if (
                !Number.isFinite(
                    quantidadeNova
                ) ||
                quantidadeNova <= 0
            ) {

                return;

            }


            itensCompra[indice].quantidade =
                quantidadeNova;


            itensCompra[indice].subtotal =
                quantidadeNova *
                Number(
                    itensCompra[indice]
                        .valorUnitario
                );


            atualizarSubtotalLinha(
                indice
            );

        }


        // ==================================================
        // ALTERAR VALOR UNITÁRIO
        // ==================================================

        function alterarValorUnitario(
            indice,
            novoValor
        ) {

            const valorNovo =
                Number(
                    novoValor
                );


            if (
                !Number.isFinite(
                    valorNovo
                ) ||
                valorNovo <= 0
            ) {

                return;

            }


            itensCompra[indice].valorUnitario =
                valorNovo;


            itensCompra[indice].subtotal =
                Number(
                    itensCompra[indice]
                        .quantidade
                ) *
                valorNovo;


            atualizarSubtotalLinha(
                indice
            );

        }


        // ==================================================
        // ATUALIZAR SOMENTE O SUBTOTAL
        // ==================================================

        function atualizarSubtotalLinha(
            indice
        ) {

            const subtotalElemento =
                document.querySelector(
                    `#subtotal-${indice}`
                );


            if (!subtotalElemento) {

                return;

            }


            subtotalElemento.textContent =
                formatarMoeda(
                    itensCompra[indice]
                        .subtotal
                );

        }


        // ==================================================
        // REMOVER ITEM
        // ==================================================

        function removerItem(
            indice
        ) {

            const item =
                itensCompra[indice];


            const confirmar =
                confirm(
                    `Deseja remover "${item.produto}" desta compra?`
                );


            if (!confirmar) {

                return;

            }


            itensCompra.splice(
                indice,
                1
            );


            atualizarTabelaItens();

        }


        // ==================================================
        // TABELA DE ITENS
        // ==================================================

        function atualizarTabelaItens() {

            listaItens.innerHTML = '';


            if (
                itensCompra.length === 0
            ) {

                listaItens.innerHTML = `

                    <tr>

                        <td colspan="5">
                            Nenhum produto adicionado.
                        </td>

                    </tr>

                `;


                return;

            }


            itensCompra.forEach(
                (item, indice) => {


                    const linha =
                        document.createElement(
                            'tr'
                        );


                    // ======================================
                    // PRODUTO
                    // ======================================

                    const colunaProduto =
                        document.createElement(
                            'td'
                        );


                    colunaProduto.textContent =
                        item.produto;


                    // ======================================
                    // QUANTIDADE EDITÁVEL
                    // ======================================

                    const colunaQuantidade =
                        document.createElement(
                            'td'
                        );


                    const inputQuantidade =
                        document.createElement(
                            'input'
                        );


                    inputQuantidade.type =
                        'number';


                    inputQuantidade.min =
                        '1';


                    inputQuantidade.step =
                        '1';


                    inputQuantidade.value =
                        item.quantidade;


                    inputQuantidade.style.width =
                        '100px';


                    inputQuantidade.addEventListener(
                        'input',
                        function () {

                            alterarQuantidade(
                                indice,
                                this.value
                            );

                        }
                    );


                    colunaQuantidade.appendChild(
                        inputQuantidade
                    );


                    // ======================================
                    // VALOR UNITÁRIO EDITÁVEL
                    // ======================================

                    const colunaValor =
                        document.createElement(
                            'td'
                        );


                    const inputValor =
                        document.createElement(
                            'input'
                        );


                    inputValor.type =
                        'number';


                    inputValor.min =
                        '0.01';


                    inputValor.step =
                        '0.01';


                    inputValor.value =
                        Number(
                            item.valorUnitario
                        ).toFixed(2);


                    inputValor.style.width =
                        '120px';


                    inputValor.addEventListener(
                        'input',
                        function () {

                            alterarValorUnitario(
                                indice,
                                this.value
                            );

                        }
                    );


                    colunaValor.appendChild(
                        inputValor
                    );


                    // ======================================
                    // SUBTOTAL
                    // ======================================

                    const colunaSubtotal =
                        document.createElement(
                            'td'
                        );


                    colunaSubtotal.id =
                        `subtotal-${indice}`;


                    colunaSubtotal.textContent =
                        formatarMoeda(
                            item.subtotal
                        );


                    // ======================================
                    // AÇÕES
                    // ======================================

                    const colunaAcoes =
                        document.createElement(
                            'td'
                        );


                    const botaoRemover =
                        document.createElement(
                            'button'
                        );


                    botaoRemover.type =
                        'button';


                    botaoRemover.textContent =
                        'Remover';


                    botaoRemover.className =
                        'btn delete';


                    botaoRemover.addEventListener(
                        'click',
                        function () {

                            removerItem(
                                indice
                            );

                        }
                    );


                    colunaAcoes.appendChild(
                        botaoRemover
                    );


                    // ======================================
                    // MONTAR LINHA
                    // ======================================

                    linha.appendChild(
                        colunaProduto
                    );


                    linha.appendChild(
                        colunaQuantidade
                    );


                    linha.appendChild(
                        colunaValor
                    );


                    linha.appendChild(
                        colunaSubtotal
                    );


                    linha.appendChild(
                        colunaAcoes
                    );


                    listaItens.appendChild(
                        linha
                    );

                }
            );

        }


        // ==================================================
        // VALIDAR ITENS
        // ==================================================

        function validarItens() {

            for (
                const item of itensCompra
            ) {

                const quantidadeItem =
                    Number(
                        item.quantidade
                    );


                const valorItem =
                    Number(
                        item.valorUnitario
                    );


                if (
                    !Number.isFinite(
                        quantidadeItem
                    ) ||
                    quantidadeItem <= 0
                ) {

                    alert(
                        `Quantidade inválida para o produto ${item.produto}.`
                    );

                    return false;

                }


                if (
                    !Number.isFinite(
                        valorItem
                    ) ||
                    valorItem <= 0
                ) {

                    alert(
                        `Valor unitário inválido para o produto ${item.produto}.`
                    );

                    return false;

                }

            }


            return true;

        }


        // ==================================================
        // VALIDAR COMPRA
        // ==================================================

        function validarCompra() {

            if (
                !selectFornecedor.value
            ) {

                alert(
                    'Selecione um fornecedor.'
                );

                return false;

            }


            if (
                !dataCompra.value
            ) {

                alert(
                    'Informe a data da compra.'
                );

                return false;

            }


            if (
                itensCompra.length === 0
            ) {

                alert(
                    'Adicione pelo menos um produto à compra.'
                );

                return false;

            }


            if (
                !validarItens()
            ) {

                return false;

            }


            return true;

        }


        // ==================================================
        // MONTAR OBJETO ENVIADO AO BACKEND
        // ==================================================

        function montarDadosCompra() {

            return {

                fornecedor_id:
                    Number(
                        selectFornecedor.value
                    ),

                data_compra:
                    dataCompra.value,

                itens:
                    itensCompra.map(
                        item => ({

                            produto_id:
                                Number(
                                    item.produtoId
                                ),

                            quantidade:
                                Number(
                                    item.quantidade
                                ),

                            valor_unitario:
                                Number(
                                    item.valorUnitario
                                )

                        })
                    )

            };

        }


        // ==================================================
        // REGISTRAR COMPRA
        // ==================================================

        async function registrarCompra() {

            if (
                !validarCompra()
            ) {

                return;

            }


            try {

                const resposta =
                    await fetch(
                        '/api/compras',
                        {

                            method:
                                'POST',

                            headers: {

                                'Content-Type':
                                    'application/json'

                            },

                            body:
                                JSON.stringify(
                                    montarDadosCompra()
                                )

                        }
                    );


                const dados =
                    await resposta.json();


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    alert(
                        dados.mensagem ||
                        'Erro ao registrar compra.'
                    );

                    return;

                }


                alert(
                    'Compra registrada com sucesso!'
                );


                limparFormulario();


            } catch (erro) {

                console.error(
                    'Erro ao registrar compra:',
                    erro
                );


                alert(
                    'Erro ao conectar com o servidor.'
                );

            }

        }


        // ==================================================
        // CARREGAR COMPRA PARA EDIÇÃO
        // ==================================================

        async function carregarCompraParaEdicao() {

            if (
                !modoEdicao
            ) {

                return;

            }


            try {

                const resposta =
                    await fetch(
                        `/api/compras/${compraIdEdicao}`
                    );


                const dados =
                    await resposta.json();


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    alert(
                        dados.mensagem ||
                        'Não foi possível carregar a compra.'
                    );

                    return;

                }


                const compra =
                    dados.compra;


                // TÍTULO

                tituloCompra.textContent =
                    'Editar Compra';


                // FORNECEDOR

                selectFornecedor.value =
                    String(
                        compra.fornecedor_id
                    );


                // DATA

                if (
                    compra.data_compra
                ) {

                    dataCompra.value =
                        String(
                            compra.data_compra
                        ).substring(
                            0,
                            10
                        );

                }


                // ITENS

                itensCompra =
                    compra.itens.map(
                        item => ({

                            produtoId:
                                Number(
                                    item.produto_id
                                ),

                            produto:
                                item.produto,

                            quantidade:
                                Number(
                                    item.quantidade
                                ),

                            valorUnitario:
                                Number(
                                    item.valor_unitario
                                ),

                            subtotal:
                                Number(
                                    item.quantidade
                                ) *
                                Number(
                                    item.valor_unitario
                                )

                        })
                    );


                atualizarTabelaItens();


                // MODO EDIÇÃO

                btnRegistrarCompra.style.display =
                    'none';


                btnEditarCompra.textContent =
                    'Salvar edição';


                btnEditarCompra.style.display =
                    'inline-block';


                btnExcluirCompra.style.display =
                    'none';


            } catch (erro) {

                console.error(
                    'Erro ao carregar compra:',
                    erro
                );


                alert(
                    'Erro ao carregar a compra.'
                );

            }

        }


        // ==================================================
        // SALVAR EDIÇÃO
        // ==================================================

        async function salvarEdicaoCompra() {

            if (
                !modoEdicao
            ) {

                alert(
                    'Selecione uma compra no Histórico para editar.'
                );

                return;

            }


            if (
                !validarCompra()
            ) {

                return;

            }


            try {

                const dadosEnviados =
                    montarDadosCompra();


                console.log(
                    'Dados enviados na edição:',
                    dadosEnviados
                );


                const resposta =
                    await fetch(
                        `/api/compras/${compraIdEdicao}`,
                        {

                            method:
                                'PUT',

                            headers: {

                                'Content-Type':
                                    'application/json'

                            },

                            body:
                                JSON.stringify(
                                    dadosEnviados
                                )

                        }
                    );


                const dados =
                    await resposta.json();


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    alert(
                        dados.mensagem ||
                        'Erro ao editar compra.'
                    );

                    return;

                }


                alert(
                    'Compra atualizada com sucesso!'
                );


                window.location.href =
                    'historico.html';


            } catch (erro) {

                console.error(
                    'Erro ao editar compra:',
                    erro
                );


                alert(
                    'Erro ao conectar com o servidor.'
                );

            }

        }


        // ==================================================
        // EXCLUIR COMPRA
        // ==================================================

        async function excluirCompraAtual() {

            if (
                !modoEdicao
            ) {

                alert(
                    'Para excluir uma compra, utilize o Histórico.'
                );

                return;

            }


            const confirmar =
                confirm(
                    'Tem certeza que deseja excluir esta compra?'
                );


            if (!confirmar) {

                return;

            }


            try {

                const resposta =
                    await fetch(
                        `/api/compras/${compraIdEdicao}`,
                        {

                            method:
                                'DELETE'

                        }
                    );


                const dados =
                    await resposta.json();


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    alert(
                        dados.mensagem ||
                        'Erro ao excluir compra.'
                    );

                    return;

                }


                alert(
                    'Compra excluída com sucesso!'
                );


                window.location.href =
                    'historico.html';


            } catch (erro) {

                console.error(
                    'Erro ao excluir compra:',
                    erro
                );


                alert(
                    'Erro ao conectar com o servidor.'
                );

            }

        }


        // ==================================================
        // LIMPAR FORMULÁRIO
        // ==================================================

        function limparFormulario() {

            itensCompra = [];


            atualizarTabelaItens();


            selectFornecedor.value = '';

            selectProduto.value = '';

            quantidade.value = '';

            valor.value = '';

            dataCompra.value = '';


            preencherDataAtual();

        }


        // ==================================================
        // DATA ATUAL
        // ==================================================

        function preencherDataAtual() {

            if (
                dataCompra.value
            ) {

                return;

            }


            const hoje =
                new Date();


            const ano =
                hoje.getFullYear();


            const mes =
                String(
                    hoje.getMonth() + 1
                ).padStart(
                    2,
                    '0'
                );


            const dia =
                String(
                    hoje.getDate()
                ).padStart(
                    2,
                    '0'
                );


            dataCompra.value =
                `${ano}-${mes}-${dia}`;

        }


        // ==================================================
        // EVENTOS
        // ==================================================

        btnAdicionarProduto.addEventListener(
            'click',
            adicionarProduto
        );


        btnRegistrarCompra.addEventListener(
            'click',
            registrarCompra
        );


        btnEditarCompra.addEventListener(
            'click',
            async function () {

                if (
                    modoEdicao
                ) {

                    await salvarEdicaoCompra();

                } else {

                    alert(
                        'Para editar uma compra, selecione-a no Histórico.'
                    );

                }

            }
        );


        btnExcluirCompra.addEventListener(
            'click',
            excluirCompraAtual
        );


        // ==================================================
        // INICIALIZAÇÃO
        // ==================================================

        async function iniciarPagina() {
