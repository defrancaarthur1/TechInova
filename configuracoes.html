<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Configurações da Conta - Adega</title><link rel="stylesheet" href="adegastyle.css"><style>
.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.config-form{display:flex;flex-direction:column;gap:12px}.config-form label{font-weight:600}.config-form input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:7px}.config-form button{padding:12px;cursor:pointer}.config-msg{min-height:1.5em;margin:8px 0}.config-card{padding:24px}.config-card h2{margin-bottom:16px}
</style></head><body>
<header class="topbar"><h1>Sistema de Controle de Compras</h1><div class="menu-mobile"><button id="btnMenu" class="btn-menu" type="button">☰</button></div><nav id="menuPrincipal"><a href="index.html">Registrar Compra</a><a href="cadastros.html">Cadastros</a><a href="editar-excluir.html">Editar / Excluir</a><a href="historico.html">Histórico</a><a href="configuracoes.html">Configurações</a><a href="#" id="btnLogout">Sair</a></nav></header>
<main class="container"><section class="card config-card"><h2>Configurações da Conta</h2><p>Administrador: <strong id="nomeConta">Carregando...</strong></p><p id="mensagemGeral" class="config-msg" role="status"></p></section>
<div class="config-grid"><section class="card config-card"><h2>Alterar e-mail</h2><form id="formEmail" class="config-form"><label for="novoEmail">Novo e-mail</label><input id="novoEmail" type="email" autocomplete="email" maxlength="150" required><label for="senhaEmail">Senha atual</label><input id="senhaEmail" type="password" autocomplete="current-password" required><button class="btn" type="submit">Salvar novo e-mail</button><p id="mensagemEmail" class="config-msg" role="status"></p></form></section>
<section class="card config-card"><h2>Alterar senha</h2><form id="formVerificarEmail" class="config-form"><label for="emailVerificacao">E-mail cadastrado</label><input id="emailVerificacao" type="email" autocomplete="off" maxlength="150" required><button class="btn" type="submit">Verificar e-mail</button><p id="mensagemVerificacao" class="config-msg" role="status"></p></form><form id="formSenha" class="config-form" hidden><label for="novaSenha">Nova senha (mínimo de 8 caracteres, 1 número e 1 símbolo)</label><input id="novaSenha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><label for="confirmarSenha">Confirmar nova senha</label><input id="confirmarSenha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><button class="btn" type="submit">Salvar nova senha</button><p id="mensagemSenha" class="config-msg" role="status"></p></form></section></div></main>
<script src="auth.js"></script><script src="configuracoes.js"></script></body></html>
