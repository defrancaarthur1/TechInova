<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico de Compras</title>

    <link rel="stylesheet" href="adegastyle.css">
</head>

<body>

<header class="topbar">

    <h1>Sistema de Controle de Compras</h1>

    <div class="menu-mobile">
    <button id="btnMenu" class="btn-menu">☰</button>
</div>

<nav id="menuPrincipal">
    <a href="index.html">Registrar Compra</a>
    <a href="cadastros.html">Cadastros</a>
    <a href="editar-excluir.html">Editar / Excluir</a>
    <a href="historico.html">Histórico</a>
    <a href="#" id="btnLogout">Sair</a>
</nav>

</header>

<main class="container">

    <section class="card full">

        <h2>Histórico de Compras</h2>

        <form id="formFiltrosHistorico" class="historico-filtros">
            <label for="filtroFornecedor">Fornecedor</label>
            <select id="filtroFornecedor"><option value="">Todos os fornecedores</option></select>
            <label for="filtroDataInicial">Data inicial</label>
            <input type="date" id="filtroDataInicial">
            <label for="filtroDataFinal">Data final</label>
            <input type="date" id="filtroDataFinal">
            <div class="historico-filtros-acoes">
                <button class="btn" type="submit">Filtrar</button>
                <button class="btn" type="button" id="limparFiltros">Limpar filtros</button>
            </div>
            <p id="mensagemFiltros" role="status" aria-live="polite"></p>
        </form>
        <div class="historico-tabela-rolagem">
            <table class="historico-tabela">
                <thead><tr><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Quantidade</th><th>Valor</th><th>Ações</th></tr></thead>
                <tbody id="tabelaHistorico"><tr><td colspan="6">Carregando compras...</td></tr></tbody>
            </table>
        </div>
    </section>
</main>
<script src="historico.js"></script>
<script src="auth.js"></script>
</body>
</html>
