<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Compras</title>
  <link rel="stylesheet" href="adegastyle.css">
  <style>
    /* Layout vertical do histórico, como na versão de referência */
    .filtros-historico {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin: 18px 0 20px;
    }
    .filtros-historico > div { width: 100%; min-width: 0; }
    .filtros-historico label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 13px;
    }
    .filtros-historico input,
    .filtros-historico select {
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }
    .acoes-filtros {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0 15px;
    }
    .acoes-filtros button {
      padding: 8px 12px;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      background: #333;
      color: white;
    }
    .acoes-filtros #limparFiltros { background: #666; }
    .tabela-rolagem { width: 100%; overflow-x: auto; }
    .tabela-rolagem table { width: 100%; min-width: 750px; }
    .acoes-compra { display: flex; justify-content: center; gap: 6px; }
    .acoes-compra button { cursor: pointer; padding: 6px 10px; border: 0; border-radius: 4px; color: white; }
    .acoes-compra .edit { background: #ff9800; }
    .acoes-compra .delete { background: #e11; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Sistema de Controle de Compras</h1>
    <div class="menu-mobile"><button id="btnMenu" class="btn-menu" type="button" aria-label="Abrir menu">☰</button></div>
    <nav id="menuPrincipal">
      <a href="index.html">Registrar Compra</a>
      <a href="cadastros.html">Cadastros</a>
      <a href="editar-excluir.html">Editar / Excluir</a>
      <a href="historico.html">Histórico</a>
      <a href="configuracoes.html">Configurações</a>
      <a href="#" id="btnLogout">Sair</a>
    </nav>
  </header>
  <main class="container">
    <section class="card full">
      <h2>Histórico de Compras</h2>
      <form id="formFiltrosHistorico">
        <div class="filtros-historico">
          <div><label for="filtroFornecedor">Fornecedor</label><select id="filtroFornecedor"><option value="">Todos os fornecedores</option></select></div>
          <div><label for="filtroDataInicial">Data inicial</label><input type="date" id="filtroDataInicial"></div>
          <div><label for="filtroDataFinal">Data final</label><input type="date" id="filtroDataFinal"></div>
        </div>
        <div class="acoes-filtros"><button type="submit">Filtrar</button><button type="button" id="limparFiltros">Limpar filtros</button></div>
      </form>
      <div class="tabela-rolagem">
        <table>
          <thead><tr><th>Data</th><th>Fornecedor</th><th>Produto</th><th>Quantidade</th><th>Valor</th><th>Ações</th></tr></thead>
          <tbody id="tabelaHistorico"><tr><td colspan="6">Carregando compras...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="auth.js"></script>
  <script src="historico.js?v=4"></script>
</body>
</html>
