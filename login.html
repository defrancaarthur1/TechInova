<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema de Controle de Compras</title>

    <link rel="stylesheet" href="adegastyle.css">
</head>

<body>

    <main class="container pagina-login">

        <section class="card login-card">

            <h1>Sistema de Controle de Compras</h1>

            <p class="login-subtitulo">
                Faça login para acessar o sistema
            </p>

            <form id="formLogin">

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" class="btn">
                    Entrar
                </button>

                <p id="mensagemDeErro" class="mensagem-de-erro"></p>

                <p id="mensagemLogin" class="mensagem-login"></p>

            </form>

        </section>

    </main>

    <script src="login.js"></script>

</body>

</html>
