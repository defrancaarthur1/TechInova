<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrar Compra</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

    <!-- CABEÇALHO / MENU -->

    <header class="cabecalho">

        <h1>
            Sistema de Controle de Compras
        </h1>

        <nav class="menu-navegacao">

            <a href="index.html">
                Início
            </a>

            <a
                href="compras.html"
                class="menu-ativo"
            >
                Registrar Compra
            </a>

            <a href="produtos.html">
                Produtos
            </a>

            <a href="fornecedores.html">
                Fornecedores
            </a>

            <!-- VOLTA PARA O INDEX E DESCE PARA O HISTÓRICO -->

            <a href="index.html#historico">
                Histórico
            </a>

            <a href="relatorios.html">
                Relatórios
            </a>

            <a
                href="login.html"
                class="botao-sair"
            >
                Sair
            </a>

        </nav>

    </header>


    <!-- CONTEÚDO -->

    <main class="pagina-formulario">

        <section class="formulario-grande">

            <h2>
                Registrar Compra
            </h2>


            <form>

                <!-- FORNECEDOR -->

                <div class="campo-formulario">

                    <label for="fornecedorSelect">
                        Fornecedor
                    </label>


                    <button
                        type="button"
                        class="btn btn-preto botao-fornecedor"
                        onclick="window.location.href='fornecedores.html'"
                    >
                        Cadastrar novo Fornecedor
                    </button>


                    <select
                        id="fornecedorSelect"
                        name="fornecedor"
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="coca">
                            Coca-Cola
                        </option>

                        <option value="gelo">
                            Distribuidora de Gelo
                        </option>

                    </select>

                </div>


                <!-- MAIS INFORMAÇÕES -->

                <button
                    type="button"
                    class="btn btn-preto botao-informacoes"
                >
                    Mais informações
                </button>


                <!-- PRODUTO -->

                <div class="campo-formulario">

                    <label for="produtoSelect">
                        Produto
                    </label>

                    <select
                        id="produtoSelect"
                        name="produto"
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="refrigerante">
                            Refrigerante
                        </option>

                        <option value="suco">
                            Suco
                        </option>

                    </select>

                </div>


                <!-- QUANTIDADE -->

                <div class="campo-formulario">

                    <label for="quantidade">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="1"
                        placeholder="Ex: 30"
                    >

                </div>


                <!-- VALOR -->

                <div class="campo-formulario">

                    <label for="valorUnitario">
                        Valor Unitário
                    </label>

                    <input
                        type="number"
                        id="valorUnitario"
                        name="valorUnitario"
                        min="0"
                        step="0.01"
                        placeholder="Ex: 5,99"
                    >

                </div>


                <!-- DATA -->

                <div class="campo-formulario">

                    <label for="dataCompra">
                        Data da Compra
                    </label>

                    <input
                        type="date"
                        id="dataCompra"
                        name="dataCompra"
                    >

                </div>


                <!-- BOTÕES -->

                <div class="botoes-formulario">

                    <button
                        type="button"
                        class="btn btn-preto"
                    >
                        Registrar
                    </button>

                    <button
                        type="button"
                        class="btn btn-editar"
                    >
                        Editar
                    </button>

                    <button
                        type="reset"
                        class="btn btn-excluir"
                    >
                        Excluir
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
