<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Controle de Compras</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- =========================================
         CABEÇALHO / MENU
    ========================================== -->

    <header class="cabecalho">

        <h1>
            Sistema de Controle de Compras
        </h1>

        <nav class="menu-navegacao">

            <a href="index.html" class="menu-ativo">
                Início
            </a>

            <a href="compras.html">
                Registrar Compra
            </a>

            <a href="produtos.html">
                Produtos
            </a>

            <a href="fornecedores.html">
                Fornecedores
            </a>

            <a href="historico.html">
                Histórico
            </a>

            <a href="relatorios.html">
                Relatórios
            </a>

            <a
                href="login.html"
                class="botao-sair"
            >
                Sair
            </a>

        </nav>

    </header>


    <!-- =========================================
         CONTEÚDO DO SISTEMA
    ========================================== -->

    <main class="conteudo-sistema">


        <!-- =====================================
             ÁREA SUPERIOR
        ====================================== -->

        <section class="area-superior">


            <!-- =================================
                 CADASTRO DE PRODUTO
            ================================== -->

            <section class="card">

                <h2>
                    Cadastro de Produto
                </h2>

                <form>


                    <div class="campo">

                        <label for="nomeProduto">
                            Nome do Produto
                        </label>

                        <input
                            type="text"
                            id="nomeProduto"
                            name="nomeProduto"
                            placeholder="Ex: Coca-Cola 2L"
                        >

                    </div>


                    <div class="campo">

                        <label for="categoriaProduto">
                            Categoria
                        </label>

                        <select
                            id="categoriaProduto"
                            name="categoriaProduto"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="refrigerante">
                                Refrigerante
                            </option>

                            <option value="cerveja">
                                Cerveja
                            </option>

                            <option value="vinho">
                                Vinho
                            </option>

                            <option value="destilado">
                                Destilado
                            </option>

                            <option value="agua">
                                Água
                            </option>

                            <option value="suco">
                                Suco
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="unidadeMedida">
                            Unidade de Medida
                        </label>

                        <select
                            id="unidadeMedida"
                            name="unidadeMedida"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="caixa">
                                Caixa
                            </option>

                            <option value="unidade">
                                Unidade
                            </option>

                            <option value="fardo">
                                Fardo
                            </option>

                            <option value="garrafa">
                                Garrafa
                            </option>

                            <option value="litro">
                                Litro
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="quantidadeProduto">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="quantidadeProduto"
                            name="quantidadeProduto"
                            min="0"
                            placeholder="Ex: 30"
                        >

                    </div>


                    <div class="campo">

                        <label for="valorProduto">
                            Valor Unitário
                        </label>

                        <input
                            type="number"
                            id="valorProduto"
                            name="valorProduto"
                            min="0"
                            step="0.01"
                            placeholder="Ex: 5,00"
                        >

                    </div>


                    <div class="botoes">

                        <button
                            type="button"
                            class="btn btn-preto"
                        >
                            Cadastrar Produto
                        </button>


                        <button
                            type="button"
                            class="btn btn-editar"
                        >
                            Editar Cadastro
                        </button>


                        <button
                            type="button"
                            class="btn btn-excluir"
                        >
                            Excluir Cadastro
                        </button>

                    </div>

                </form>

            </section>


            <!-- =================================
                 REGISTRAR COMPRA
            ================================== -->

            <section class="card">

                <h2>
                    Registrar Compra
                </h2>

                <form>


                    <div class="campo">

                        <label for="fornecedor">
                            Fornecedor
                        </label>

                        <button
                            type="button"
                            class="btn btn-preto botao-fornecedor"
                        >
                            Cadastrar novo Fornecedor
                        </button>


                        <select
                            id="fornecedor"
                            name="fornecedor"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="coca-cola">
                                Coca-Cola
                            </option>

                            <option value="gelo">
                                Distribuidora de Gelo
                            </option>

                            <option value="ambev">
                                Ambev
                            </option>

                        </select>

                    </div>


                    <button
                        type="button"
                        class="btn btn-preto botao-informacoes"
                    >
                        Mais informações
                    </button>


                    <div class="campo">

                        <label for="produtoCompra">
                            Produto
                        </label>

                        <select
                            id="produtoCompra"
                            name="produtoCompra"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="refrigerante">
                                Refrigerante
                            </option>

                            <option value="coca2l">
                                Coca-Cola 2L
                            </option>

                            <option value="gelo">
                                Gelo
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="quantidadeCompra">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="quantidadeCompra"
                            name="quantidadeCompra"
                            min="1"
                            placeholder="Ex: 30"
                        >

                    </div>


                    <div class="campo">

                        <label for="valorCompra">
                            Valor Unitário
                        </label>

                        <input
                            type="number"
                            id="valorCompra"
                            name="valorCompra"
                            min="0"
                            step="0.01"
                            placeholder="Ex: 5,99"
                        >

                    </div>


                    <div class="campo">

                        <label for="dataCompra">
                            Data da Compra
                        </label>

                        <input
                            type="date"
                            id="dataCompra"
                            name="dataCompra"
                        >

                    </div>


                    <div class="botoes">

                        <button
                            type="button"
                            class="btn btn-preto"
                        >
                            Registrar
                        </button>


                        <button
                            type="button"
                            class="btn btn-editar"
                        >
                            Editar
                        </button>


                        <button
                            type="button"
                            class="btn btn-excluir"
                        >
                            Excluir
                        </button>

                    </div>

                </form>

            </section>

        </section>


        <!-- =====================================
             HISTÓRICO DE COMPRAS
        ====================================== -->

        <section class="card historico">

            <h2>
                Histórico de Compras
            </h2>


            <form class="form-filtro">


                <div class="campo">

                    <label for="filtroFornecedor">
                        Fornecedor
                    </label>

                    <select
                        id="filtroFornecedor"
                        name="filtroFornecedor"
                    >

                        <option value="">
                            Todos
                        </option>

                        <option value="coca-cola">
                            Coca-Cola
                        </option>

                        <option value="gelo">
                            Distribuidora de Gelo
                        </option>

                        <option value="ambev">
                            Ambev
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="dataInicial">
                        Data inicial
                    </label>

                    <input
                        type="date"
                        id="dataInicial"
                        name="dataInicial"
                    >

                </div>


                <div class="campo">

                    <label for="dataFinal">
                        Data final
                    </label>

                    <input
                        type="date"
                        id="dataFinal"
                        name="dataFinal"
                    >

                </div>


                <button
                    type="button"
                    class="btn btn-preto botao-filtrar"
                >
                    Filtrar
                </button>

            </form>


            <!-- =================================
                 TABELA DO HISTÓRICO
            ================================== -->

            <div class="container-tabela">

                <table>

                    <thead>

                        <tr>
                            <th>Data</th>
                            <th>Fornecedor</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>

                    </thead>


                    <tbody>

                        <tr>

                            <td>
                                10/03
                            </td>

                            <td>
                                Coca-Cola
                            </td>

                            <td>
                                Coca 2L
                            </td>

                            <td>
                                30
                            </td>

                            <td>
                                R$ 200,00
                            </td>

                            <td>

                                <div class="acoes-tabela">

                                    <button
                                        type="button"
                                        class="btn btn-editar"
                                    >
                                        Editar
                                    </button>


                                    <button
                                        type="button"
                                        class="btn btn-excluir"
                                    >
                                        Excluir
                                    </button>

                                </div>

                            </td>

                        </tr>


                        <tr>

                            <td>
                                12/03
                            </td>

                            <td>
                                Distribuidora de Gelo
                            </td>

                            <td>
                                Gelo
                            </td>

                            <td>
                                10
                            </td>

                            <td>
                                R$ 80,00
                            </td>

                            <td>

                                <div class="acoes-tabela">

                                    <button
                                        type="button"
                                        class="btn btn-editar"
                                    >
                                        Editar
                                    </button>


                                    <button
                                        type="button"
                                        class="btn btn-excluir"
                                    >
                                        Excluir
                                    </button>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</body>

</html>
