name: Build and deploy Node.js app to Azure Web App - techInova-2026

on:
  push:
    branches:
      - 'Arthur'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        run: npm ci --prefix servidor

      - name: Prepare deployment package
        run: |
          mkdir pacote
          cp -r servidor pacote/
          cp -r *.html *.js *.css pacote/ 2>/dev/null || true
          cp adega_controle.sql pacote/ 2>/dev/null || true
          rm -f pacote/servidor/.env
          printf '{"name":"techinova","version":"1.0.0","scripts":{"start":"node servidor/server.js"}}' > pacote/package.json

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: pacote/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A27AE2807CC44F2BFA6394918C8AD1D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC7FCAC0C6B3421DA8B33B5A3DD4344F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B047D0EAB0314614BAAE0BD2A36902FE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'techInova-2026'
          slot-name: 'Production'
          package: .
